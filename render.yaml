services:
  - type: web
    name: it-service-bot
    runtime: python
    rootDir: telegram-bot
    numInstances: 1
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_RUN_MODE
        value: webhook
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Yangon
      - key: MONTHLY_REPORT_RECIPIENT_EMAIL
        sync: false
      - key: MONTHLY_REPORT_SEND_HOUR
        value: "9"
      - key: MONTHLY_REPORT_SEND_MINUTE
        value: "0"
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: HEALTHCHECK_PATH
        value: /healthz
      - key: DROP_PENDING_UPDATES
        value: "false"
      - key: DATA_DIR
        value: /opt/render/project/src/telegram-bot/data
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/telegram-bot/data
      sizeGB: 1
