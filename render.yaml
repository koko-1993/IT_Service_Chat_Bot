services:
  - type: web
    name: it-service-bot
    runtime: python
    rootDir: telegram-bot
    numInstances: 1
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_RUN_MODE
        value: webhook
      - key: FREE_PLAN_MODE
        value: "true"
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: USER_EMAIL_REQUIRED
        value: "false"
      - key: MONTHLY_REPORT_ENABLED
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Yangon
      - key: MONTHLY_REPORT_SEND_HOUR
        value: "9"
      - key: MONTHLY_REPORT_SEND_MINUTE
        value: "0"
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: HEALTHCHECK_PATH
        value: /healthz
      - key: DROP_PENDING_UPDATES
        value: "false"
      - key: DATA_DIR
        value: ./data
